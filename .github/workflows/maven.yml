# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Iriva CI with Maven for Prod Branch

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build and analyze
      working-directory: transparency-portal
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        DB_URL: ${{ secrets.DB_URL }}
        DB_USERNAME: ${{ secrets.DB_USERNAME }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}        
      run:  mvn -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar -Dsonar.organization="${{ vars.SONAR_ORGANIZATION_KEY }}" -Dsonar.projectKey="${{ vars.SONAR_BACKEND_PROJECT_KEY }}"

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  
    runs-on: ubuntu-latest
  
    steps:
      - name: Deploy to Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
       
